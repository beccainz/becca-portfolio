<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Becca Inz: creative strategist portfolio. Paid social, organic content, and creator partnerships.">
<title>Becca Inz</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#E7ECEF;
  --bg-raised:color-mix(in srgb, var(--bg) 88%, #14202A 12%);
  --bg-card:#F4EEE2;
  --ink:#1B1A17;
  --ink-soft:color-mix(in srgb, var(--ink) 68%, var(--bg) 32%);
  --ink-faint:color-mix(in srgb, var(--ink) 42%, var(--bg) 58%);
  --accent:#8C3223;
  --accent-ink:#F4EEE2;
  --pop:#B54A26;
  --line:rgba(27,26,23,0.16);
  --line-strong:rgba(27,26,23,0.32);
  --shadow:0 1px 0 rgba(27,26,23,0.08);
  --radius:2px;
  --serif:'Fraunces',ui-serif,Georgia,'Times New Roman',serif;
  --sans:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Space Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --script:'Caveat',cursive;
}
/* This is a fixed "poster" palette by design — alternating cream/brick
   bands are the point, so the look intentionally does not change with
   OS light/dark preference or the data-theme toggle. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ }
}
:root[data-theme="dark"]{ }

/* ============================================================
   TONE SCOPES
   ------------------------------------------------------------
   Full-bleed sections flip from cream to brick-red by re-declaring
   these same variable names locally. Every component in this file
   reads var(--bg)/var(--ink)/etc, so wrapping any section in
   .tone-dark (or .tone-light) re-themes everything inside it —
   cards, chips, buttons, nav — with zero component-level rewrites.
   ============================================================ */
.tone-light{
  --bg:#E7ECEF;
  --bg-raised:color-mix(in srgb, var(--bg) 88%, #14202A 12%);
  --bg-card:#F4EEE2;
  --ink:#1B1A17;
  --ink-soft:color-mix(in srgb, var(--ink) 68%, var(--bg) 32%);
  --ink-faint:color-mix(in srgb, var(--ink) 42%, var(--bg) 58%);
  --accent:#8C3223;
  --accent-ink:#F4EEE2;
  --pop:#B54A26;
  --line:rgba(27,26,23,0.16);
  --line-strong:rgba(27,26,23,0.32);
  background:var(--bg);
  color:var(--ink);
}
.tone-dark{
  --bg:#8C3223;
  --bg-raised:color-mix(in srgb, var(--bg) 85%, #000 15%);
  --bg-card:color-mix(in srgb, var(--bg) 78%, #F4EEE2 22%);
  --ink:#F4EEE2;
  --ink-soft:color-mix(in srgb, var(--ink) 74%, var(--bg) 26%);
  --ink-faint:color-mix(in srgb, var(--ink) 48%, var(--bg) 52%);
  --accent:#F4EEE2;
  --accent-ink:#8C3223;
  --pop:#E7ECEF;
  --line:rgba(244,238,226,0.22);
  --line-strong:rgba(244,238,226,0.4);
  background:var(--bg);
  color:var(--ink);
}

/* ============================================================
   RESET / BASE
   ============================================================ */
*{box-sizing:border-box;}
html,body{background:var(--bg);}
body{
  margin:0;
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:clip;
}
img,video{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;}
h1,h2,h3,h4,p,figure{margin:0;}
[hidden]{display:none!important;}
::selection{background:var(--accent);color:var(--accent-ink);}

.wrap{
  max-width:1360px;
  margin:0 auto;
  padding-inline:clamp(18px,4vw,56px);
}
.eyebrow{
  font-family:var(--mono);
  font-size:11.5px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.serif{font-family:var(--serif);}
.balance{text-wrap:balance;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* focus states */
a:focus-visible,button:focus-visible,input:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}

/* ============================================================
   NAV
   ============================================================ */
.nav{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:100;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px) saturate(1.1);
  -webkit-backdrop-filter:blur(10px) saturate(1.1);
  border-bottom:1px solid var(--line);
}
.nav-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-block:16px;
  gap:16px;
}
.wordmark{
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
}
.wordmark .logo-mark{color:var(--accent);flex:none;}
.wordmark .lockup{
  font-family:var(--serif);
  font-weight:700;
  font-size:19px;
  letter-spacing:-0.01em;
  transform:scaleX(0.92);
  transform-origin:left center;
  display:inline-block;
}
.wordmark em{
  font-style:italic;
  color:var(--accent);
}
.nav-links{
  display:flex;
  align-items:center;
  gap:clamp(14px,2.4vw,34px);
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
}
.nav-links a{
  position:relative;
  padding-block:4px;
  color:var(--ink-soft);
  transition:color .18s ease;
}
.nav-links a:hover,.nav-links a.active{color:var(--ink);}
.nav-links a.active::after{
  content:"";
  position:absolute;left:0;right:0;bottom:-3px;
  height:2px;background:var(--accent);
}
.nav-cta{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  border:1px solid var(--ink);
  padding:8px 14px;
  border-radius:99px;
  white-space:nowrap;
  transition:background .18s ease,color .18s ease;
}
.nav-cta:hover{background:var(--ink);color:var(--bg);}
.nav-burger{display:none;}

@media (max-width:760px){
  .nav-links.desktop{display:none;}
  .nav-cta.desktop{display:none;}
  .nav-burger{
    display:flex;
    width:34px;height:34px;
    align-items:center;justify-content:center;
    border:1px solid var(--line-strong);
    border-radius:99px;
  }
  .nav-burger span{position:relative;width:14px;height:9px;display:block;}
  .nav-burger span::before,.nav-burger span::after{
    content:"";position:absolute;left:0;right:0;height:1.4px;background:var(--ink);
  }
  .nav-burger span::before{top:0;}
  .nav-burger span::after{bottom:0;}
  .mobile-menu{
    display:none;
    flex-direction:column;
    gap:0;
    border-top:1px solid var(--line);
    background:var(--bg);
  }
  .mobile-menu.open{display:flex;}
  .mobile-menu a{
    padding:16px clamp(18px,4vw,56px);
    border-bottom:1px solid var(--line);
    font-family:var(--serif);
    font-size:22px;
  }
  .mobile-menu .nav-cta{
    margin:16px clamp(18px,4vw,56px) 20px;
    text-align:center;
    border-radius:99px;
  }
}
@media (min-width:761px){ .mobile-menu{display:none!important;} }

/* ============================================================
   HOME
   ============================================================ */
.name-lockup{
  text-align:center;
  padding-block:clamp(40px,7vw,64px) clamp(36px,5vw,56px);
}
.kicker-row{
  display:flex;align-items:center;justify-content:center;gap:14px;
  font-family:var(--mono);font-size:13.65px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
  margin-bottom:clamp(18px,3vw,30px);
}
.kicker-row .rule{flex:0 1 90px;height:1px;background:var(--line-strong);}
.name-big{
  font-family:var(--serif);
  font-weight:800;
  font-size:clamp(3.4rem,15vw,10.5rem);
  line-height:0.84;
  letter-spacing:-0.01em;
  transform:scaleX(0.86);
  display:inline-block;
}
.name-big em{font-style:italic;font-weight:600;color:var(--accent);}
.name-lockup .hero-ticker{justify-content:center;margin-top:clamp(18px,3vw,28px);}
.hero-ticker{
  font-family:var(--mono);
  font-size:16.25px;
  letter-spacing:0.02em;
  color:var(--ink-faint);
  display:flex;
  gap:8px;
  align-items:center;
  min-height:18px;
}
.hero-ticker b{color:var(--ink);font-weight:600;}
.hero-ticker .cursor-blink{
  display:inline-block;width:7px;height:14px;background:var(--pop);
  animation:blink 1s step-end infinite;
}
@keyframes blink{50%{opacity:0;}}

/* intro band — dark full-bleed section with polaroid + script accent */
.intro-band{padding-block:clamp(56px,8vw,100px);}
.intro-band .wrap{
  display:grid;grid-template-columns:0.85fr 1.15fr;gap:clamp(32px,6vw,72px);align-items:center;
}
@media (max-width:820px){ .intro-band .wrap{grid-template-columns:1fr;text-align:center;} }
.intro-band h2{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(1.7rem,3.6vw,2.6rem);
  line-height:1.14;margin-bottom:18px;max-width:22ch;
}
@media (max-width:820px){ .intro-band h2{max-width:none;margin-inline:auto;} }
.intro-band p{font-size:22.1px;color:var(--ink-soft);max-width:52ch;margin-bottom:14px;}
@media (max-width:820px){ .intro-band p{margin-inline:auto;} }
.intro-skills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
@media (max-width:820px){ .intro-skills{justify-content:center;} }
.intro-skills .chip{font-size:13px;padding:6px 11px;}
.intro-photo-wrap{display:flex;justify-content:center;}

/* script / handwritten accents */
.script{font-family:var(--script);font-weight:600;line-height:1;}
.script-hi{
  display:block;
  font-size:clamp(2.2rem,5vw,3.4rem);
  margin-bottom:16px;
}

/* polaroid photo frame — always physical white/cream paper,
   regardless of the surrounding section's tone */
.polaroid{
  background:#F4EEE2;
  padding:14px 14px 44px;
  box-shadow:0 20px 34px -14px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.18);
  width:min(78%,300px);
  display:inline-block;
}
.polaroid .frame{width:100%;}
.polaroid figcaption{
  font-family:var(--script);
  font-size:19px;
  text-align:center;
  color:#1B1A17;
  margin-top:10px;
}

/* full-bleed tone bands wrapping a page's title block */
.page-head-band,.proj-head-band{padding-block:0;}

/* selected work strip */
.strip-head{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-block:clamp(48px,6vw,72px) 22px;
  gap:16px;flex-wrap:wrap;
}
.strip-head h2{
  font-family:var(--serif);
  font-size:clamp(1.5rem,2.6vw,2rem);
  font-weight:500;
}
.strip-head a{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  border-bottom:1px solid var(--ink);
  padding-bottom:2px;
}
.hscroll{
  display:flex;
  gap:18px;
  overflow-x:auto;
  padding-bottom:18px;
  scroll-snap-type:x proximity;
  margin-inline:calc(-1 * clamp(18px,4vw,56px));
  padding-inline:clamp(18px,4vw,56px);
}
.hscroll::-webkit-scrollbar{height:5px;}
.hscroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;}
.hscroll .card{scroll-snap-align:start;flex:none;}
.hscroll .card.size-9x16{width:min(64vw,240px);}
.hscroll .card.size-4x5{width:min(78vw,300px);}
.hscroll .card.size-1x1{width:min(78vw,300px);}
.hscroll .card.size-16x9{width:min(92vw,420px);}
.idx-wrap{position:relative;}
.idx-chevron{
  display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  color:var(--pop);margin-bottom:8px;
}

/* my journey — home page career-story steps (3-up on desktop, stacks on mobile) */
.journey{
  margin-block:clamp(56px,7vw,96px);
  padding-block:clamp(32px,5vw,52px);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.journey-head{max-width:48ch;margin-bottom:clamp(28px,4.4vw,44px);}
.journey-head .eyebrow{font-size:23.92px;}
.journey-head h2{
  font-family:var(--serif);font-size:clamp(1.7rem,3.4vw,2.5rem);font-weight:500;
  line-height:1.15;margin-top:10px;
}
.journey-rule{width:48px;height:1px;background:var(--line-strong);margin-block:16px;}
.journey-subline{
  font-family:var(--mono);font-size:19.435px;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--ink-faint);display:block;
}
.journey-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0;
}
.journey-step{
  position:relative;
  padding:18px 22px 4px;
  border-left:1px solid var(--line);
}
.journey-step:first-child{border-left:none;}
.journey-step .num{
  font-family:var(--mono);font-size:18.59px;color:var(--pop);
  letter-spacing:0.06em;
  display:block;margin-bottom:10px;
}
.journey-step h3{
  font-family:var(--serif);font-size:clamp(1.365rem,2.08vw,1.69rem);font-weight:600;
  margin-bottom:8px;
}
.journey-step p{font-size:23.4px;color:var(--ink-soft);}
@media (max-width:820px){
  .journey-row{grid-template-columns:1fr;}
  .journey-step{border-left:none!important;border-top:1px solid var(--line);padding-inline:0;}
  .journey-step:first-child{border-top:none;}
}

/* home footer CTA banner */
.cta-band{
  margin-block:0;
  padding-block:clamp(48px,7vw,88px);
}
.cta-script{
  font-family:var(--script);
  font-weight:600;
  font-size:clamp(1.5rem,3.2vw,2.1rem);
  line-height:1;
  display:block;
  margin-bottom:12px;
}
.cta-band .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;}
.cta-band h2{
  font-family:var(--serif);font-weight:500;
  font-size:clamp(2rem,5.4vw,3.6rem);
  line-height:1.02;max-width:14ch;
  transform:scaleX(0.92);
  transform-origin:left center;
}
.accent-word{color:var(--pop);font-style:italic;}
.cta-actions{display:flex;flex-direction:column;gap:10px;align-items:flex-start;}
.pill-btn{
  font-family:var(--mono);font-size:13px;letter-spacing:0.06em;text-transform:uppercase;
  border:1px solid var(--ink);color:var(--ink);
  padding:12px 22px;border-radius:99px;
  display:inline-flex;align-items:center;gap:8px;
  transition:background .18s ease, color .18s ease;
}
.pill-btn:hover{background:var(--ink);color:var(--bg);}
.cta-band .meta{font-family:var(--mono);font-size:12px;opacity:0.6;}

/* ============================================================
   CARDS (Work / Playground grids)
   ============================================================ */
.archive-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-auto-flow:row dense;
  gap:clamp(14px,2vw,26px);
}
.card{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.card.span-2{grid-column:span 2;}
.card.span-3{grid-column:span 3;}
.card.span-4{grid-column:span 4;}
.card.span-6{grid-column:span 6;}
@media (max-width:920px){
  .card.span-2,.card.span-3,.card.span-4{grid-column:span 3;}
  .archive-grid{grid-template-columns:repeat(6,1fr);}
}
@media (max-width:600px){
  .card.span-2,.card.span-3,.card.span-4,.card.span-6{grid-column:span 6;}
}

.card-media{
  position:relative;
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid var(--line);
  cursor:pointer;
}
.card-media .frame{
  position:relative;
  width:100%;
  display:flex;align-items:flex-end;
  overflow:hidden;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
}
.card-media:hover .frame{transform:scale(1.025);}
.card-media .tex{
  position:absolute;inset:0;
  opacity:0.5;
  mix-blend-mode:multiply;
}
.card-media .fmt-tag{
  position:relative;z-index:2;
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:0.08em;
  padding:9px 10px;
  color:inherit;
  display:flex;align-items:center;gap:6px;
}
.card-media .glyph{
  position:absolute;
  font-family:var(--serif);
  font-style:italic;
  font-weight:600;
  line-height:0.8;
  opacity:0.22;
  z-index:1;
  bottom:-0.12em;right:-0.02em;
  font-size:6.4rem;
  pointer-events:none;
}
.card-media .view-tab{
  position:absolute;top:10px;right:10px;z-index:3;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--bg);color:var(--ink);
  padding:6px 10px;border-radius:99px;
  opacity:0;transform:translateY(-4px);
  transition:opacity .2s ease, transform .2s ease;
}
.card-media:hover .view-tab{opacity:1;transform:translateY(0);}

.card-body h3{
  font-family:var(--serif);
  font-weight:500;
  font-size:clamp(1.05rem,1.5vw,1.28rem);
  line-height:1.18;
}
.card-body a{display:block;}
.card-body a:hover h3{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px;}
.card-meta{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-faint);
  letter-spacing:0.03em;
  margin-top:2px;
}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
.chip{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:0.04em;
  text-transform:uppercase;
  padding:4px 8px;
  border:1px solid var(--line-strong);
  border-radius:99px;
  color:var(--ink-soft);
  background:transparent;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
button.chip{cursor:pointer;}
button.chip:hover{border-color:var(--ink);}

/* playground-flavored card */
.card.playground .card-media{
  border-style:dashed;
  border-color:var(--line-strong);
}
.stamp{
  position:absolute;top:10px;left:10px;z-index:3;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--pop);
  border:1px solid var(--pop);
  padding:4px 8px;border-radius:99px;
  transform:rotate(-3deg);
  background:var(--bg-card);
}

/* ============================================================
   WORK / PLAYGROUND ARCHIVE PAGES
   ============================================================ */
.page-head{
  padding-block:clamp(40px,6vw,64px) clamp(24px,4vw,36px);
}
.page-head h1{
  font-family:var(--serif);
  font-weight:600;
  font-size:clamp(2.4rem,7vw,4.6rem);
  letter-spacing:-0.02em;
  transform:scaleX(0.9);
  transform-origin:left center;
  display:inline-block;
}
.page-head p{
  margin-top:14px;max-width:52ch;
  color:var(--ink-soft);
  font-size:clamp(15px,1.5vw,17px);
}
.filter-bar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding-block:16px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin-bottom:clamp(28px,4vw,44px);
  position:relative;
}
.filter-bar button.chip{padding:7px 13px;font-size:11px;}
.filter-toggle{display:none;}
.filter-chips{display:flex;flex-wrap:wrap;gap:8px;width:100%;}
@media (max-width:760px){
  .filter-bar{flex-direction:column;padding-block:4px;}
  .filter-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:14px 2px;
    color:var(--ink);
  }
  .filter-toggle .chev{font-size:10px;transition:transform .2s ease;}
  .filter-toggle[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .filter-chips{display:none;padding-bottom:14px;}
  .filter-chips.open{display:flex;}
}
.archive-section{padding-bottom:clamp(60px,8vw,110px);}
.work-section{margin-bottom:clamp(40px,6vw,64px);}
.work-section:last-child{margin-bottom:0;}
.work-section-head{
  font-family:var(--serif);
  font-weight:500;
  font-size:clamp(1.3rem,2.2vw,1.7rem);
  margin-bottom:18px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line);
}
.count-note{
  font-family:var(--mono);font-size:11px;color:var(--ink-faint);
  margin:-8px 0 22px;

/* ============================================================
   PLACEHOLDER MEDIA — abstract, labeled, swap-ready.
   No fabricated screenshots; just format-coded color blocks.
   ============================================================ */
const HUES = {
  a:{bg:"var(--ink)",fg:"var(--bg)"},
  b:{bg:"var(--accent)",fg:"var(--accent-ink)"},
  c:{bg:"var(--bg-raised)",fg:"var(--ink)"},
  d:{bg:"var(--pop)",fg:"var(--accent-ink)"},
  e:{bg:"var(--bg-card)",fg:"var(--ink)"}
};
function texturePattern(seed){
  const patterns = [
    "repeating-linear-gradient(45deg, currentColor 0 1px, transparent 1px 14px)",
    "repeating-linear-gradient(90deg, currentColor 0 1px, transparent 1px 18px)",
    "radial-gradient(currentColor 1px, transparent 1.4px)",
    "repeating-linear-gradient(-45deg, currentColor 0 1px, transparent 1px 22px)"
  ];
  return patterns[seed % patterns.length];
}
function mediaBlock({ratio, format, hue, glyph, big}){
  const h = HUES[hue]||HUES.a;
  const seed = (format||"").length;
  return `<div class="frame" style="aspect-ratio:${ratio};background:${h.bg};color:${h.fg};width:100%">
    <span class="tex" style="background-image:${texturePattern(seed)};background-size:${18+ (seed%3)*6}px ${18+(seed%3)*6}px;color:${h.fg}"></span>
    ${big?`<span class="glyph" style="color:${h.fg}">${glyph||"BI"}</span>`:""}
    <span class="fmt-tag" style="color:${h.fg}">${format}</span>
  </div>`;
}

/* ============================================================
   REAL MEDIA
   ------------------------------------------------------------
   To swap a placeholder block for a real photo or video, add a
   "media" field to a project object (or gallery item) in PROJECTS:
     media: { type:"image", src:"assets/dog-hero.jpg" }
     media: { type:"video", src:"assets/dog-hero.mp4", poster:"assets/dog-hero.jpg" }
   "src" is a path relative to this HTML file (so an "assets"
   folder sitting next to index.html in the repo works as-is).
   Leave "media" out (or set it to null) to keep the placeholder.
   ============================================================ */
function renderMedia(media, fallback){
  if(media && media.src){
    const src = escapeHTML(media.src);
    /* `contain` mode (used for the project-detail hero) shows the whole
       frame at its real aspect ratio instead of cropping it to fill a
       fixed box — the video/image just renders smaller when its real
       shape doesn't match the surrounding container. */
    const baseStyle = fallback.contain
      ? `aspect-ratio:${fallback.ratio};object-fit:contain;height:min(70vh,640px);width:auto;max-width:100%;display:block;margin-inline:auto;`
      : `aspect-ratio:${fallback.ratio};object-fit:cover;width:100%;display:block;`;
    if(media.type === "video"){
      const poster = media.poster ? ` poster="${escapeHTML(media.poster)}"` : "";
      return `<video class="frame" style="${baseStyle}" src="${src}"${poster} controls playsinline preload="metadata"></video>`;
    }
    return `<img class="frame" style="${baseStyle}" src="${src}" alt="${escapeHTML(media.alt || fallback.format || "")}" loading="lazy">`;
  }
  return mediaBlock(fallback);
}

const $ = (sel,el=document)=>el.querySelector(sel);
const $$ = (sel,el=document)=>[...el.querySelectorAll(sel)];
function byId(id){return PROJECTS.find(p=>p.id===id);}
function chip(text, extra=""){return `<span class="chip ${extra}">${text}</span>`;}
function initials(title){
  const words = title.replace(/[“”"'?]/g,"").split(/\s+/).filter(w=>/[A-Za-z]/.test(w[0]));
  const stop = new Set(["a","the","of","to","for","if","is","so","my","that","it","from","as","in","on"]);
  const strong = words.filter(w=>!stop.has(w.toLowerCase()));
  const pick = (strong.length>=2 ? strong : words).slice(0,2);
  return pick.map(w=>w[0].toUpperCase()).join("");
}

function cardHTML(p){
  const href = `#/project/${p.id}`;
  const pg = p.isPlayground;
  return `
  <article class="card ${pg?"playground":""} span-${sizeSpan(p.size)}">
    <a href="${href}" class="card-media" aria-label="${escapeHTML(p.title)}">
      ${pg?`<span class="stamp">Self-Initiated</span>`:""}
      <span class="view-tab">View →</span>
      ${renderMedia(p.media, {ratio:p.aspect, format:p.format, hue:p.hue, glyph:initials(p.title), big:true})}
    </a>
    <div class="card-body">
      <a href="${href}">
        <h3 class="balance">${escapeHTML(p.title)}</h3>
      </a>
      <div class="card-meta">${escapeHTML(p.client)}</div>
      <div class="chip-row">${p.tags.slice(0,3).map(t=>chip(t)).join("")}</div>
    </div>
  </article>`;
}
function sizeSpan(size){ return {sm:2, md:3, lg:4, xl:6}[size]||3; }
function escapeHTML(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

      <p>Client work across paid social, organic content, and creator partnerships, filed by what it actually is, not when it happened.</p>
    </div>
  </section>
  <section class="wrap">
    <div class="filter-bar" id="workFilters">
      <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="filterChips">
        <span id="filterToggleLabel">Filter</span>
        <span class="chev">⌄</span>
      </button>
      <div class="filter-chips" id="filterChips">
        ${WORK_FILTERS.map(f=>`<button class="chip ${f==='All'?'on':''}" data-filter="${f}">${f}</button>`).join("")}
      </div>
    </div>
    <div class="count-note" id="workCount"></div>

  <section class="wrap archive-section" id="workSections"></section>

}
function mountWork(){
  const items = PROJECTS.filter(p=>!p.isPlayground && p.section);
  const sectionsEl = $("#workSections");
  const countEl = $("#workCount");
  const toggleBtn = $("#filterToggle");
  const toggleLabel = $("#filterToggleLabel");
  const chipsEl = $("#filterChips");
  function updateToggleLabel(){
    if(!toggleLabel) return;
    toggleLabel.textContent = workActive.size ? `Filter (${workActive.size})` : "Filter";
  }
  function render(){
    const on = workActive.size ? items.filter(p=>[...workActive].every(f=>p.workType.includes(f))) : items;
    countEl.textContent = `${on.length} project${on.length===1?"":"s"}`;
    if(!on.length){
      sectionsEl.innerHTML = `<p style="color:var(--ink-faint);font-family:var(--mono);font-size:13px;">No projects match that combination yet.</p>`;
      return;
    }
    sectionsEl.innerHTML = WORK_SECTIONS.map(sec=>{
      const inSection = on.filter(p=>p.section===sec);
      if(!inSection.length) return "";
      return `
      <div class="work-section">
        <h2 class="work-section-head">${sec}</h2>
        <div class="archive-grid">${inSection.map(cardHTML).join("")}</div>
      </div>`;
    }).join("");
  }
  $$("#filterChips button").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const f = btn.dataset.filter;
      if(f==="All"){ workActive.clear(); }
      else{
        if(workActive.has(f)) workActive.delete(f); else workActive.add(f);
      }
      $$("#filterChips button").forEach(b=>b.classList.toggle("on", b.dataset.filter==="All" ? workActive.size===0 : workActive.has(b.dataset.filter)));
      updateToggleLabel();
      render();
    });
  });
  if(toggleBtn && chipsEl){
    toggleBtn.addEventListener("click",()=>{
      const open = chipsEl.classList.toggle("open");
      toggleBtn.setAttribute("aria-expanded", open ? "true" : "false");
    });
  }
  updateToggleLabel();
  render();
}

function viewProject(id){
  const p = byId(id);
  if(!p){ location.hash = "#/work"; return ""; }
  const idx = PROJECTS.filter(x=>x.isPlayground===p.isPlayground);
  const pos = idx.findIndex(x=>x.id===p.id);
  const next = idx[(pos+1)%idx.length];
  const labelSet = p.isPlayground ? LABELS.playground : LABELS.work;
  const backHref = p.isPlayground ? "#/playground" : "#/work";
  const backLabel = p.isPlayground ? "← Playground" : "← Work";

  let sectionCount = 0;
  const blocks = [1,2,3,4,5].map(n=>{
    const meta = labelSet[n];
    const text = p[meta.key];
    if(!text) return "";
    sectionCount++;
    const title = (p.labelOverrides && p.labelOverrides[meta.key]) || meta.title;
    return `<div class="proj-block ${n===5?'full':''}">
      <span class="eyebrow"><span class="idx">${String(sectionCount).padStart(2,'0')} ›</span> ${title}</span>
      <p>${text}</p>
      ${n===5 ? galleryHTML(p) : ""}
    </div>`;
  }).join("");

  const resultsHTML = (p.results && p.results.length) ? `
    <div class="proj-block full">
      <span class="eyebrow"><span class="idx">${String(sectionCount+1).padStart(2,'0')} ›</span> ${p.isPlayground?"Why It Matters":"The Results"}</span>
      <div class="results-band">
        ${p.results.map(r=>`<div class="result-tile"><span class="stat">${r.stat}</span><span class="label">${r.label}</span></div>`).join("")}
      </div>
    </div>` : "";

  return `
  <section class="proj-head-band tone-dark">
    <div class="wrap proj-head">
      <a href="${backHref}" class="proj-back">${backLabel}</a>
      <div class="proj-tagrow">
        ${p.isPlayground?`<span class="chip on" style="background:var(--pop);border-color:var(--pop);">Self-Initiated</span>`:""}
        ${p.projectType.map(t=>chip(t)).join("")}
      </div>
      <h1 class="proj-title balance">${escapeHTML(p.title)}</h1>
      <div class="proj-meta-row">
        <div class="meta-item"><div class="eyebrow">Client</div><div class="val">${escapeHTML(p.client)}</div></div>

    </div>
  </section>

  <section class="wrap proj-body">
    ${blocks}
    ${resultsHTML}
    <div class="proj-block full">
      <span class="eyebrow">My Role</span>
      <div class="role-list">${p.role.map(r=>chip(r)).join("")}</div>

  <section class="wrap proj-nextrow">

/* ============================================================
   DECK VIEWER — click-through slide-deck component for a project
   page. p.deck = {images:[...filenames in order], aspect:"16/9"}
   ============================================================ */
function deckViewerHTML(p){
  if(!p.deck || !p.deck.images || !p.deck.images.length) return "";
  const imgs = p.deck.images;
  return `<div class="deck-viewer" data-deck data-count="${imgs.length}">
    <div class="deck-stage" style="aspect-ratio:${p.deck.aspect||'16/9'}">
      <img class="deck-slide-img" data-deck-img src="${imgs[0]}" alt="Slide 1 of ${imgs.length}" draggable="false">
      <button type="button" class="deck-arrow deck-prev" data-deck-prev aria-label="Previous slide">‹</button>
      <button type="button" class="deck-arrow deck-next" data-deck-next aria-label="Next slide">›</button>
      <span class="deck-hint">Use ← → to browse</span>
      <span class="deck-counter" data-deck-counter>1 / ${imgs.length}</span>
    </div>
    <div class="deck-thumbs" data-deck-thumbs>
      ${imgs.map((src,i)=>`<button type="button" class="deck-thumb ${i===0?'active':''}" data-deck-thumb="${i}" aria-label="Go to slide ${i+1}"><img src="${src}" alt="" draggable="false"></button>`).join("")}
    </div>
  </div>`;
}
let deckKeyHandler = null;
function initDeckViewer(p){
  if(deckKeyHandler){ document.removeEventListener("keydown", deckKeyHandler); deckKeyHandler = null; }
  if(!p || !p.deck) return;
  const root = $("[data-deck]");
  if(!root) return;
  const imgs = p.deck.images;
  const stageImg = root.querySelector("[data-deck-img]");
  const counter = root.querySelector("[data-deck-counter]");
  const thumbs = $$("[data-deck-thumb]", root);
  let idx = 0;
  function show(i){
    idx = (i + imgs.length) % imgs.length;
    stageImg.src = imgs[idx];
    stageImg.alt = `Slide ${idx+1} of ${imgs.length}`;
    counter.textContent = `${idx+1} / ${imgs.length}`;
    thumbs.forEach((t,ti)=>t.classList.toggle("active", ti===idx));
    const activeThumb = thumbs[idx];
    if(activeThumb) activeThumb.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
  }
  root.querySelector("[data-deck-prev]").addEventListener("click", ()=>show(idx-1));
  root.querySelector("[data-deck-next]").addEventListener("click", ()=>show(idx+1));
  thumbs.forEach(t=>t.addEventListener("click", ()=>show(+t.dataset.deckThumb)));
  deckKeyHandler = function(e){
    if(!document.body.contains(root)){ document.removeEventListener("keydown", deckKeyHandler); deckKeyHandler = null; return; }
    if(e.key==="ArrowLeft"){ show(idx-1); }
    else if(e.key==="ArrowRight"){ show(idx+1); }
  };
  document.addEventListener("keydown", deckKeyHandler);
}

/* ============================================================
   ROUTER
   ============================================================ */
const app = $("#app");
const TICKER_WORDS = ["creator-led paid social","brand voice at scale","turning a swab into 4.8M views","the next micro-trend","performance data as a creative brief"];
let tickerTimer;

function setActiveNav(name){
  $$(".nav-links a, .mobile-menu a").forEach(a=>a.classList.toggle("active", a.dataset.nav===name));
}
function startTicker(){
  clearInterval(tickerTimer);
  let i=0;
  const el = $("#tickerWord");
  if(!el) return;
  tickerTimer = setInterval(()=>{
    i=(i+1)%TICKER_WORDS.length;
    el.style.opacity=0;
    setTimeout(()=>{ el.textContent = TICKER_WORDS[i]; el.style.opacity=1; },220);
  },2800);
  el.style.transition="opacity .2s ease";
}
function revealOnScroll(){
  const els = $$(".reveal:not(.in)");
  if(!els.length) return;
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); obs.unobserve(e.target); } });
  },{threshold:0.12});
  els.forEach(el=>obs.observe(el));
}

/* Videos are plain HTMLMediaElements, and pausing/removing them from the
   page does not reliably stop their audio: a <video> that's mid-playback
   can keep making sound after app.innerHTML is overwritten on navigation,
   since detaching a media element from the DOM doesn't force it to stop.
   Explicitly pause + drop the source (and call load()) before every route
   swap so nothing keeps playing in the background after you navigate away. */
function stopAllMedia(){
  $$("video, audio").forEach(el=>{
    try{
      el.pause();
      el.removeAttribute("src");
      el.load();
    }catch(e){}
  });
}
/* Also make sure only one video plays at a time on a page that has
   several (e.g. a project's gallery) — starting one pauses the rest. */
document.addEventListener("play", (e)=>{
  if(e.target.tagName === "VIDEO"){
    $$("video").forEach(v=>{ if(v !== e.target) v.pause(); });
  }
}, true);

function route(){
  const hash = location.hash || "#/";
  const parts = hash.replace(/^#\//,"").split("/").filter(Boolean);
  stopAllMedia();
  clearInterval(tickerTimer);
  closeMobileMenu();
  if(deckKeyHandler){ document.removeEventListener("keydown", deckKeyHandler); deckKeyHandler = null; }

  if(parts.length===0){
    app.innerHTML = viewHome();
    setActiveNav("home");
    startTicker();
  } else if(parts[0]==="work"){
    app.innerHTML = viewWork();
    setActiveNav("work");
    mountWork();
  } else if(parts[0]==="playground"){
    app.innerHTML = viewPlayground();
    setActiveNav("playground");
  } else if(parts[0]==="about"){
    app.innerHTML = viewAbout();
    setActiveNav("about");
  } else if(parts[0]==="project" && parts[1]){
    app.innerHTML = viewProject(parts[1]);
    setActiveNav(byId(parts[1])?.isPlayground ? "playground" : "work");
    initDeckViewer(byId(parts[1]));
  } else {
    app.innerHTML = viewHome();
    setActiveNav("home");
    startTicker();
  }
  window.scrollTo({top:0,behavior:"instant"});
  revealOnScroll();
}
window.addEventListener("hashchange", route);

function closeMobileMenu(){
  $("#mobileMenu")?.classList.remove("open");
}
$("#burgerBtn").addEventListener("click", ()=>{
  $("#mobileMenu").classList.toggle("open");
});
$$(".mobile-menu a").forEach(a=>a.addEventListener("click", closeMobileMenu));

$("#yr").textContent = new Date().getFullYear();
route();
</script>
